name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        if: hashFiles('Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
        if: hashFiles('Cargo.toml') != ''
      - name: Stellar CLI
        if: hashFiles('Cargo.toml') != ''
        # soroban-sdk 28 solo compila contratos con `stellar contract build` (CLI >= 25.2).
        uses: stellar/stellar-cli@v28.1.0
      - name: Contratos (fmt, wasm, clippy, tests)
        if: hashFiles('Cargo.toml') != ''
        # El wasm se compila ANTES de los tests: la factory importa el wasm del escrow
        # (contractimport!) desde target/wasm32v1-none/release/.
        run: |
          cargo fmt --all -- --check
          stellar contract build
          ls -la target/wasm32v1-none/release/*.wasm
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - uses: pnpm/action-setup@v4
        if: hashFiles('pnpm-lock.yaml') != ''
      - uses: actions/setup-node@v4
        if: hashFiles('pnpm-lock.yaml') != ''
        with:
          node-version: 22
          cache: pnpm
      - name: Front (typecheck, lint, tests)
        if: hashFiles('pnpm-lock.yaml') != ''
        run: |
          pnpm install --frozen-lockfile
          pnpm -r --if-present typecheck
          pnpm -r --if-present lint
          pnpm -r --if-present test
      - name: Nada que probar todavía
        if: hashFiles('Cargo.toml') == '' && hashFiles('pnpm-lock.yaml') == ''
        run: echo "Aún no hay Cargo.toml ni pnpm-lock.yaml."
