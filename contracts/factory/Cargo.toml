[package]
name = "factory"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

# Importa los tipos y el wasm del escrow con `contractimport!` desde
# target/wasm32v1-none/release/escrow.wasm (raíz del workspace): compila el escrow
# antes (`cargo build --release --target wasm32v1-none -p escrow`).

# Versiones y perfiles en el Cargo.toml raíz del workspace (área deps, P2).
[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
