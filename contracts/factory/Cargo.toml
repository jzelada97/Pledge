[package]
name = "factory"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

# Importa los tipos y el wasm del escrow con `contractimport!` desde
# ../escrow/target/wasm32v1-none/release/escrow.wasm: compila el escrow antes
# (`stellar contract build` en contracts/escrow).

# Versiones explícitas mientras no exista el Cargo.toml raíz (área deps, P2).
# Cuando exista, pasan a `{ workspace = true }`.
[dependencies]
soroban-sdk = "28.0.0"

[dev-dependencies]
soroban-sdk = { version = "28.0.0", features = ["testutils"] }

# Workspace propio y perfiles iguales a los del escrow, para compilar el crate solo.
# Se borra este bloque cuando el crate entre en el workspace raíz.
[workspace]

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
