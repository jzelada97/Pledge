# Derived from Trustless-Work/trustlesswork-smart-contract-stellar@1d22d0c (contracts/escrow/Cargo.toml), modified. See contracts/escrow/NOTICE.md
[package]
name = "escrow"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

# FIANZAS: versiones explícitas en vez de `workspace = true` mientras no exista el
# Cargo.toml raíz (área deps, P2). Cuando exista, vuelven a `{ workspace = true }`.
[dependencies]
soroban-sdk = "28.0.0"
soroban-token-sdk = "28.0.0"

[dev-dependencies]
soroban-sdk = { version = "28.0.0", features = ["testutils"] }
soroban-token-sdk = "28.0.0"

# FIANZAS: workspace propio y perfiles del Cargo.toml raíz del upstream, para compilar
# el crate solo. Se borra todo este bloque cuando el crate entre en el workspace raíz.
[workspace]

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
