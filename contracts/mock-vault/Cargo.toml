[package]
name = "mock-vault"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

# FIANZAS: versiones explícitas y workspace propio mientras el crate no esté en `members` del
# Cargo.toml raíz (área deps). Al añadirlo, pasar a `{ workspace = true }` y borrar [workspace] y perfiles.
[dependencies]
soroban-sdk = "28.0.0"

[dev-dependencies]
soroban-sdk = { version = "28.0.0", features = ["testutils"] }

[workspace]

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
